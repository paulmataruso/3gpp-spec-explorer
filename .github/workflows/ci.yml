name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - name: Python converter scripts compile
        run: python3 -m py_compile scraper/docx/*.py scraper/figures/*.py

  docker:
    # what users run: docker compose build (the data is downloaded at first start, not here)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - name: Data scripts parse
        run: node --check scripts/fetch-data.mjs && node --check scripts/publish-data.mjs && sh -n docker/entrypoint.sh
